name: UI Release Migration

on:
  push:
    branches: [fix/audit-issues-2026-08-26]

permissions:
  contents: write

jobs:
  migrate:
    if: contains(github.event.head_commit.message, '[run-ui-migration]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/audit-issues-2026-08-26

      - name: Apply UI migration
        run: python3 tool/ui_release_migrate.py

      - name: Commit migrated UI
        run: |
          if git diff --quiet; then
            echo "No migration changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens lib/widgets
          git commit -m "Migrate active UI to theme-aware localized surfaces"
          git push origin HEAD:fix/audit-issues-2026-08-26
