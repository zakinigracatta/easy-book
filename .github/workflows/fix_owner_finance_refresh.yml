name: Fix Owner Finance Refresh

on:
  push:
    branches: [fix/audit-issues-2026-08-26]

permissions:
  contents: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, '[fix-finance-refresh]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/audit-issues-2026-08-26

      - name: Apply finance refresh repair
        run: python3 tool/fix_owner_finance_refresh.py

      - name: Commit repairs
        run: |
          if git diff --quiet; then
            echo "No finance refresh repairs required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib
          git commit -m "Fix owner revenue refresh after booking completion"
          git push origin HEAD:fix/audit-issues-2026-08-26
