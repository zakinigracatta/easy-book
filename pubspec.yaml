name: easy_book
description: "Easy Book - Premium Booking Platform for Barbers, Hair Salons, Spas & Beauty Clinics"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^3.15.2
  firebase_auth: ^5.6.2
  cloud_firestore: ^5.6.9
  firebase_messaging: ^15.2.4
  firebase_storage: ^12.4.4
  cloud_functions: ^5.2.4

  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  go_router: ^14.0.0

  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  glassmorphism: ^3.0.0
  shimmer: ^3.0.0
  flutter_rating_bar: ^4.0.1
  fl_chart: ^0.68.0

  hive: ^2.2.3
  hive_flutter: ^1.1.0

  flutter_secure_storage: ^9.0.0

  dio: ^5.4.3+1
  cached_network_image: ^3.3.1

  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png